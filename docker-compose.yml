version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: opkit-postgres
    environment:
      POSTGRES_USER: opkit_user
      POSTGRES_PASSWORD: opkit_password
      POSTGRES_DB: opkit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: